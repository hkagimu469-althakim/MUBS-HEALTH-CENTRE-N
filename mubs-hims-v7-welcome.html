:root{--bg:#faf5ec;--cd:#fffdf8;--tx:#2b1d1a;--mu:#75635b;--br:#e6d9c6;--pr:#5e1a2b;--pt:#fff8ec;--ac:#8a5c14;--at:#f6ead2;--wa:#a55a00;--wt:#fdf0dc;--er:#b42318;--et:#fde8e6;--gd:#c9a050;--gd2:#e7cf93;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1210;--cd:#261a17;--tx:#f3e8da;--mu:#b9a79a;--br:#43322c;--pr:#e0b46a;--pt:#1b1210;--ac:#e0b46a;--at:#3a2a1c;--wa:#f0b35a;--wt:#3a2b12;--er:#ff8a7d;--et:#3d1b18;--gd:#e0b46a;--gd2:#7a5a2a}}
:root[data-theme="dark"]{--bg:#1b1210;--cd:#261a17;--tx:#f3e8da;--mu:#b9a79a;--br:#43322c;--pr:#e0b46a;--pt:#1b1210;--ac:#e0b46a;--at:#3a2a1c;--wa:#f0b35a;--wt:#3a2b12;--er:#ff8a7d;--et:#3d1b18;--gd:#e0b46a;--gd2:#7a5a2a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Public Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--pr);color:var(--pt);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
header b{font-size:18px}header small{opacity:.8;display:block;font-size:12px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button,.lo{background:transparent;color:inherit;border:0;padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer}
nav button[aria-current=true]{background:rgba(255,255,255,.18);font-weight:700}
main{max-width:1000px;margin:0 auto;padding:20px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}
.cd{background:var(--cd);border:1px solid var(--br);border-radius:10px;padding:18px;margin-bottom:16px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.st b{font-size:30px;display:block;line-height:1.1}.mu{color:var(--mu);font-size:14px}
input,select,textarea,.bt{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--br);border-radius:8px;padding:10px 12px;width:100%}
label{display:block;font-size:14px;color:var(--mu);margin-bottom:10px}label input,label select,label textarea{margin-top:4px}
.bt{width:auto;background:var(--pr);color:var(--pt);border-color:var(--pr);cursor:pointer;font-weight:500}
.bt.s{background:transparent;color:var(--tx);border-color:var(--br)}.bt.ok{background:var(--ac);border-color:var(--ac);color:#fff}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--br);font-size:15px}
th{color:var(--mu);font-weight:500;font-size:13px}tr.r{cursor:pointer}tr.r:hover td{background:var(--at)}
.w{overflow-x:auto}.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--at);color:var(--ac)}
.tag.w2{background:var(--wt);color:var(--wa)}.tag.e{background:var(--et);color:var(--er)}
.al{background:var(--wt);color:var(--wa);padding:10px 14px;border-radius:8px;margin-bottom:14px}.al.e{background:var(--et);color:var(--er)}
.f{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.vi{border-left:3px solid var(--ac);padding:2px 0 2px 14px;margin:0 0 16px}.vi select{width:auto;padding:4px 8px;font-size:13px}
.bt.dn{background:var(--er);border-color:var(--er);color:var(--pt)}.em{border-left:4px solid var(--er)}
.ov{position:fixed;inset:0;background:rgba(30,12,10,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.ov .cd{max-width:420px;margin:0}
.doc{border:2px dashed var(--br)}.cd{overflow-x:auto}
@media(max-width:600px){main{padding:14px}h1{font-size:22px}header{padding:10px 14px}nav button{padding:8px 10px}.rx{grid-template-columns:1fr}.hero h1{font-size:26px}}
@media print{header,.np,#t{display:none}}
.hero{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start;margin-top:4vh}
.hero h1{font-size:34px;line-height:1.15}.hero ol{padding-left:20px;margin:16px 0}.hero li{margin-bottom:6px}
.rx{display:grid;gap:8px;grid-template-columns:2fr 70px 3fr;margin-bottom:8px}.y{color:var(--ac);font-weight:700;text-align:center}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--pr);color:var(--pt);padding:10px 18px;border-radius:8px;display:none;z-index:9;max-width:90%}

/* ---- Welcome page ---- */
h1,h2,.serif{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif}
h1{letter-spacing:.2px}
.wn{position:sticky;top:0;z-index:10;background:var(--pr);color:var(--pt);display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap;padding:10px 24px;border-bottom:3px solid var(--gd);box-shadow:0 2px 14px rgba(60,20,20,.18)}
.wn .br{display:flex;align-items:center;gap:10px;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:700;line-height:1.1}
.wn .br small{display:block;font:500 11px 'Public Sans',sans-serif;letter-spacing:1.6px;text-transform:uppercase;opacity:.75}
.crest{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--gd2),var(--gd));color:#4a1522;font-weight:700;font-size:20px;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.wn nav{justify-content:center}
.wn nav a{color:inherit;text-decoration:none;padding:8px 14px;border-radius:6px;font-size:15px;cursor:pointer}
.wn nav a:hover,.wn nav a:focus-visible{background:rgba(255,255,255,.16)}
.wn .si{background:linear-gradient(145deg,var(--gd2),var(--gd));color:#4a1522;border:0;border-radius:99px;padding:9px 22px;font:700 15px 'Public Sans',sans-serif;cursor:pointer}
.wn .si:hover{filter:brightness(1.06)}
.wh{background:radial-gradient(1000px 420px at 85% -10%,rgba(201,160,80,.28),transparent 60%),linear-gradient(160deg,#4a1522 0%,#6d2433 55%,#8a3a3a 100%);color:#fff8ec;padding:56px 24px 72px}
.wh .in{max-width:1080px;margin:0 auto;display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center}
.eb{display:inline-block;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#e7cf93;border:1px solid rgba(231,207,147,.5);padding:4px 12px;border-radius:99px;margin-bottom:16px}
.wh h1{font-size:50px;line-height:1.05;margin:0 0 14px;color:#fff8ec}
.wh h1 em{font-style:italic;color:#e7cf93}
.wh p.lead{font-size:18px;opacity:.9;max-width:520px;margin:0 0 22px}
.wh .cta{display:flex;gap:12px;flex-wrap:wrap}
.wh .cta a{cursor:pointer;text-decoration:none;padding:11px 24px;border-radius:99px;font-weight:700;font-size:15px}
.wh .cta .p{background:linear-gradient(145deg,#f1dca3,#c9a050);color:#4a1522}
.wh .cta .o{border:1.5px solid rgba(231,207,147,.7);color:#f1dca3}
.lg{background:var(--cd);color:var(--tx);border:1px solid var(--gd);border-radius:16px;padding:28px;box-shadow:0 18px 50px rgba(30,8,10,.35);margin:0}
.lg h2{font-size:30px;margin:0 0 2px;color:var(--pr)}
.lg .bt{width:100%;padding:12px;margin-top:4px;border-radius:99px;background:var(--pr);color:var(--pt);border-color:var(--pr)}
.lg .fp{font-size:13px;margin:12px 0 0;text-align:center}
.ws{max-width:1080px;margin:0 auto;padding:60px 24px 8px}
.ws h2{font-size:36px;color:var(--pr);margin:0 0 6px;text-align:center}
.ws .sub{text-align:center;color:var(--mu);max-width:560px;margin:0 auto 30px}
.rule{width:70px;height:3px;background:var(--gd);border-radius:3px;margin:8px auto 14px}
.sv{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.sv .c{background:var(--cd);border:1px solid var(--br);border-top:4px solid var(--gd);border-radius:12px;padding:22px;transition:transform .2s,box-shadow .2s}
.sv .c:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(94,26,43,.14)}
.sv .ic{font-size:26px;width:48px;height:48px;border-radius:12px;background:var(--at);display:grid;place-items:center;margin-bottom:12px}
.sv h3{font:700 22px 'Cormorant Garamond',Georgia,serif;margin:0 0 6px;color:var(--pr)}
.sv p{margin:0;color:var(--mu);font-size:15px}
.st3{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));counter-reset:s}
.st3 .c{position:relative;background:var(--at);border-radius:12px;padding:26px 22px 22px}
.st3 .c:before{counter-increment:s;content:counter(s);position:absolute;top:-16px;left:20px;width:34px;height:34px;border-radius:50%;background:var(--pr);color:var(--pt);display:grid;place-items:center;font:700 18px 'Cormorant Garamond',serif;border:2px solid var(--gd)}
.st3 p{margin:0}
.ct{background:var(--cd);border:1px solid var(--br);border-radius:12px;padding:24px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ct b{display:block;color:var(--pr);font-family:'Cormorant Garamond',serif;font-size:20px}
.ct span{color:var(--mu);font-size:15px}
.wf{margin-top:56px;background:#3a1019;color:#e9d9bd;text-align:center;padding:26px 20px;font-size:14px;border-top:3px solid var(--gd)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .wn,:root:not([data-theme="light"]) .wn .br{color:#1b1210}:root:not([data-theme="light"]) .wn .si{background:#1b1210;color:#e0b46a}:root:not([data-theme="light"]) .lg .bt{color:#1b1210}}
@media(max-width:700px){.wn{padding:10px 14px}.wn nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start}.wn nav a{white-space:nowrap}.wh{padding:36px 16px 48px}.wh h1{font-size:36px}.ws{padding:44px 16px 4px}.ws h2{font-size:30px}.wn .si{margin-left:auto}}
html{scroll-behavior:smooth}
/* ---- MUBS logo in every navigation bar ---- */
.logo{height:34px;width:34px;object-fit:contain;flex:none;background:#fff;border-radius:50%;padding:1px;box-shadow:0 0 0 1.5px rgba(231,207,147,.8)}
header>.bn{display:flex;align-items:center;gap:10px}
@media(max-width:600px){@media(max-width:600px){.logo{height:30px;width:30px}}

let GEO=null,GWATCH=null,GLAST=0;
const gfix=p=>({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),at:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});

function locate(){if(!navigator.geolocation)return gmsg('<span class="tag e">This device cannot share location</span>');

function gwatch(){if(GWATCH!==null||!navigator.geolocation)return;
 GWATCH=navigator.geolocation.watchPosition(p=>{GEO=gfix(p);if(!myAlert())return stopGeo();if(Date.now()-GLAST>15000){GLAST=Date.now();call('emg.loc',{geo:GEO})}},()=>{},{enableHighAccuracy:true,maximumAge:5000})}
function stopGeo(){if(GWATCH!==null&&navigator.geolocation)navigator.geolocation.clearWatch(GWATCH);GWATCH=null;GEO=null}
function emgHook(){GEO?gmsg(`<span class="tag">Location on · accurate to about ${GEO.acc} m</span>`):locate();if(myAlert())gwatch()}

 const fire=()=>{const r=call('emg.send',{loc,text,geo:GEO});if(!r.ok)return toast(r.msg);gwatch();toast(GEO?'Emergency alert sent with your location. Stay where you are.':'Emergency alert sent, but your location is off. Stay where you are and tell responders where you are.');render()};
 if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{GEO=gfix(p);fire()},()=>fire(),{enableHighAccuracy:true,timeout:6000,maximumAge:5000});else fire()}
const geoLine=e=>e.geo?`<b>Live location:</b> <a href="https://www.google.com/maps?q=${+e.geo.lat},${+e.geo.lng}" target="_blank" rel="noopener">${+e.geo.lat}, ${+e.geo.lng}</a> <span class="mu">(about ${+e.geo.acc} m, updated ${esc(e.geo.at)})</span><br>`:`<span class="tag w2">Location not shared</span><br>`;
function emg(){return can('emg.send')?emgStu():emgStaff()}
function emgStu(){const E=call('me.read').E;return`<h1>Emergency</h1><div class="al e">If someone is in immediate danger, also call emergency services. This alert goes to the nurse and admin, who notify the health minister so help can reach you.</div>
 <div class="cd"><b>Your location</b> <span id="gs"></span><p class="mu" style="margin:6px 0 0">Your location is sent with your alert and kept up to date until you reach the sickbay, so responders can find you.</p></div>
 <div class="cd"><div class="f"><label>Where are you?<select id="el"><option>Hostel</option><option>Lecture block</option><option>Campus grounds</option><option>Library or cafeteria</option><option>Other place on campus</option></select></label><label>Room, building or landmark<input id="ep" placeholder="e.g. Block B, room 12"></label></div>
 <label>Describe the illness or problem<textarea id="et" rows="3" placeholder="What is happening? How long? Can you move?"></textarea></label><button class="bt dn" onclick="sendEmg()">Send emergency alert</button></div>
 ${E.map(e=>`<div class="cd em"><b>${e.date} ${e.t}</b> · ${esc(e.loc)}<br>${esc(e.text)}<br><span class="tag ${e.st==='AtSickbay'?'':'w2'}">${ESL[e.st]}</span>${e.geo?' <span class="tag">Location shared</span>':''}${e.aa?`<br><b>Action report:</b> ${esc(e.aa.note)}`:''}</div>`).join('')}`}
const NX={Notified:['OnTheWay','Mark: on the way'],OnTheWay:['Reached','Mark: patient reached'],Reached:['AtSickbay','Mark: patient at sickbay']},SL={New:'New',Notified:'Minister notified',OnTheWay:'On the way',Reached:'Patient reached',AtSickbay:'At sickbay'};
function emgStaff(){const E=call('emg.view').d;return`<h1>Emergency alerts</h1><p class="mu">Alerts from students. Nurses and the admin notify the health minister, who reaches the patient and takes them to the MUBS sickbay.</p>
 ${E.map(e=>{const n=NX[e.st];return`<div class="cd em"><b>${esc(e.name)}</b> <span class="mu">${e.date} ${e.t} · ${esc(e.phone)}</span><br><b>Location:</b> ${esc(e.loc)}<br>${geoLine(e)}${esc(e.text)}<br><span class="tag ${e.st==='AtSickbay'?'':'e'}">${SL[e.st]}</span>${e.aa?`<br><b>After-action report</b> (${esc(e.aa.by)}, ${esc(e.aa.t)}): ${esc(e.aa.note)}`:''}
 ${can('emg.notify')&&e.st==='New'?`<p><button class="bt dn" onclick="run('emg.notify',{id:'${e.id}'},'Health minister notified.')">Notify health minister</button></p>`:''}${can('emg.respond')&&n?`<p><button class="bt ok" onclick="run('emg.respond',{id:'${e.id}',st:'${n[0]}'},'Status updated.')">${n[1]}</button></p>`:''}${can('emg.after')&&e.st==='AtSickbay'&&!e.aa?`<label>After-action note<textarea id="aa${e.id}" rows="2" placeholder="What was done? Outcome? Follow-up needed?"></textarea></label><p><button class="bt ok" onclick="run('emg.after',{id:'${e.id}',note:$('#aa${e.id}').value.trim()},'Nurse and admin notified.')">Notify nurse and admin of action taken</button></p>`:''}</div>`}).join('')||'<div class="cd">No emergency alerts.</div>'}`}
const feeTag=p=>`<span class="tag ${p.paid?'':'e'}">${p.paid?'Fees paid':'Fees unpaid'}</span>`;
function hp(p){const h=p.h,r=(l,v)=>`<tr><th>${l}</th><td>${esc(v)||'<span class="mu">None recorded</span>'}</td></tr>`;return`<table>${r('Blood group',h.blood)}${r('Allergies',h.allergy)}${r('Chronic illnesses',h.chronic)}${r('Hereditary conditions',h.hereditary)}${r('Environmental factors',h.environmental)}${r('Other illnesses',h.other)}</table>`}
function history(V,R){const ed=can('vis.set');return V.length?V.map(v=>`<div class="vi"><b>${v.date}</b> <span class="tag">${esc(v.d)}</span> ${ed?`<select aria-label="Visibility" onchange="run('vis.set',{vid:'${v.id}',v:this.value})">${Object.keys(VL).map(k=>`<option value="${k}" ${v.vis===k?'selected':''}>${VL[k]}</option>`).join('')}</select>`:''}${can('pat.read')&&v.vis!=='Visible'?'<span class="tag w2">Hidden from students</span>':''}<br>${esc(v.c)}<br><span class="mu">${esc(v.vit)} · examined by ${esc(v.by)}</span>${R.filter(r=>r.vid===v.id).map(r=>`<br>Prescription: ${r.items.map(i=>esc(i.d)+' x'+i.q).join(', ')} <span class="tag ${r.st==='Pending'?'w2':''}">${r.st==='Pending'?'Collect at pharmacy':'Dispensed'}</span>`).join('')}</div>`).join(''):'<p class="mu">No visits to show.</p>'}
/* ---- Staff pages (only reachable through permitted nav items) ---- */
function pat(){const s=q.toLowerCase(),R=call('pat.list').d.filter(p=>!s||[p.name,p.id,p.reg,p.course].some(x=>x.toLowerCase().includes(s)));
 return`<h1>Patients</h1><div style="display:flex;gap:10px;margin:12px 0"><input id="sq" placeholder="Search by name, patient ID or registration number" value="${esc(q)}" oninput="q=this.value;render();const i=$('#sq');i.focus();i.setSelectionRange(q.length,q.length)">${can('pat.create')?`<button class="bt" onclick="showReg=!showReg;render()">${showReg?'Close':'Register patient'}</button>`:''}</div>
 ${cred?`<div class="al"><b>Patient saved.</b> Patient login: email <b>${esc(cred.email)}</b>, one-time password <b>${cred.pin}</b>. The patient must change it at first sign-in. Patient ID <b>${cred.id}</b>.</div>`:''}${showReg&&can('pat.create')?regForm():''}
 <div class="cd"><div class="w"><table><tr><th>Patient ID</th><th>Name</th><th>Course</th><th>Fees</th><th>Last visit</th></tr>${R.map(p=>`<tr class="r" tabindex="0" onclick="go('rec','${p.id}')" onkeydown="if(event.key==='Enter')go('rec','${p.id}')"><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.course)}</td><td>${feeTag(p)}</td><td>${p.last||'None'}</td></tr>`).join('')||'<tr><td colspan=5>No match. Register the student above.</td></tr>'}</table></div></div>`}
function regForm(){const t=(i,l,x='')=>`<label>${l}<input id="${i}" ${x}></label>`;return`<div class="cd"><h2>Register patient after diagnosis</h2><div class="f">${t('rn','Full name')}<label>Patient type<select id="rk"><option>Student</option><option>Worker</option></select></label>${t('rs','Student or staff number')}${t('rr','Registration number','placeholder="24/U/10001/PS"')}${t('re','Patient email','type=email placeholder="2400710005@stud.mubs.ac.ug"')}<label>Sex<select id="rx"><option>F</option><option>M</option></select></label>${t('rd','Date of birth','type=date')}${t('rp','Phone','type=tel')}${t('rc','Course or department')}</div>
 <h2 style="margin-top:8px">Health status</h2><div class="f">${t('hd','Diagnosis at registration')}${t('hb','Blood group')}${t('ha','Known allergies')}${t('hc','Chronic illnesses')}${t('hh','Hereditary conditions')}${t('he','Environmental factors')}${t('ho','Other illnesses or past conditions')}</div>
 ${can('fee.set')?'<label style="display:flex;gap:8px;align-items:center"><input id="rf" type="checkbox" style="width:auto"> Medical fees paid</label>':'<p class="mu">Fees start as unpaid. The admin records payment.</p>'}<button class="bt" onclick="addP()">Save patient</button></div>`}
function addP(){const g=i=>$(i).value.trim();if(!g('#rn')||!g('#rs')||!g('#rr')||!g('#re')||!g('#hd'))return toast('Enter the name, student number, registration number, student email and diagnosis.');
 const r=call('pat.create',{name:g('#rn'),sn:g('#rs'),reg:g('#rr'),email:g('#re').toLowerCase(),sex:g('#rx'),dob:g('#rd'),phone:g('#rp'),course:g('#rc'),cat:g('#rk'),paid:can('fee.set')&&$('#rf').checked,h:{chronic:g('#hc'),hereditary:g('#hh'),environmental:g('#he'),other:g('#ho')+(g('#ho')?'; ':'')+'Diagnosis: '+g('#hd'),allergy:g('#ha'),blood:g('#hb')}});
 if(!r.ok)return toast(r.msg);cred={id:r.id,pin:r.pin,email:g('#re').toLowerCase()};showReg=false;go('pat')}
function rec(){const r=call('pat.read',{id:pid});if(!r.ok)return'<p>Patient not found.</p>';const p=r.p;
 return`<button class="bt s" onclick="go('pat')">Back to patients</button><h1 style="margin-top:12px">${esc(p.name)} ${feeTag(p)}</h1><p class="mu">${p.id} · ${esc(p.cat||'Student')} · ${esc(p.reg)} · ${p.sex==='F'?'Female':'Male'}, ${age(p.dob)} yrs · ${esc(p.course)} · ${esc(p.phone)}</p>
 ${p.h.allergy?`<div class="al e"><b>Allergy:</b> ${esc(p.h.allergy)}</div>`:''}${can('fee.set')?`<p><button class="bt s" onclick="run('fee.set',{id:'${p.id}',paid:${!p.paid}},'Fee status updated.')">${p.paid?'Mark fees unpaid':'Record fee payment'}</button></p>`:''}
 ${can('exam.create')?examBox(p):''}<div class="cd"><h2>Health profile</h2>${hp(p)}</div><div class="cd"><h2>Visit history</h2>${history(r.V,r.R)}</div>`}
function examBox(p){if(!p.paid)return`<div class="al e"><b>Medical attention blocked.</b> Fees not paid. Send the student to the accounts office.</div>`;
 if(exam!==p.id)return`<div class="cd"><h2>Sickbay check-in</h2><p class="mu">Ask the student to enter their own login details to confirm who they are before examination.</p>${vform(p.id)}</div>`;
 const o=call('stock.view').d.map(d=>`<option>${esc(d.n)}</option>`).join('');return`<div class="cd"><h2>Medical form</h2><span class="tag">Identity and fees verified</span><div class="f" style="margin-top:12px"><label>Complaint<input id="cc"></label><label>Vitals<input id="cv" placeholder="Temp, BP, weight"></label><label>Diagnosis<input id="cg"></label>
 <label>Student visibility<select id="cz">${Object.keys(VL).map(k=>`<option value="${k}">${VL[k]}</option>`).join('')}</select></label></div><h2>Drugs to give out</h2><p class="mu">Saving creates a medical document and sends it to the pharmacist.</p>
 ${[0,1,2].map(i=>`<div class="rx"><select id="d${i}"><option value="">Drug ${i+1}: none</option>${o}</select><input id="q${i}" type="number" min="1" value="1" aria-label="Quantity"><input id="s${i}" placeholder="Dosage, e.g. 2 tabs twice daily"></div>`).join('')}<button class="bt" onclick="addV('${p.id}')">Save form and send to pharmacist</button></div>`}
function vform(id){return`<div class="f"><label>Student email<input id="ve" type="email" autocomplete="off"></label><label>Student password<input id="vp" type="password" autocomplete="off"></label></div><button class="bt ok" onclick="verify('${id}')">Verify student</button>`}
function verify(id){const r=call('exam.verify',{email:$('#ve').value.trim().toLowerCase(),pw:$('#vp').value,pid:id});if(!r.ok)return toast(r.msg);tab='rec';pid=r.pid;exam=r.paid?r.pid:null;if(!r.paid)toast('Fees unpaid: medical attention refused.');render()}
function chk(){return`<h1>Sickbay check-in</h1><p class="mu">The student tells you what is wrong. Then they enter their own login details here to confirm identity and fees before you open the medical form.</p><div class="cd">${vform('')}</div>`}
function addV(id){const g=i=>$(i).value.trim();if(!g('#cc')||!g('#cg'))return toast('Enter the complaint and the diagnosis.');
 const items=[0,1,2].filter(i=>g('#d'+i)).map(i=>({d:g('#d'+i),q:+g('#q'+i)||1,s:g('#s'+i)}));if(run('exam.create',{pid:id,vid:exam,c:g('#cc'),d:g('#cg'),vit:g('#cv'),vis:g('#cz'),items},'Medical form saved and sent to the pharmacist.').ok)exam=null,render()}
const doc=x=>`<div class="doc cd"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b>MUBS Health Centre · Medical form</b><span>No. ${esc(x.no||x.id)}</span></div><p class="mu">Date ${x.date} · Prescribed by ${esc(x.by||'Nurse')}</p>
 <table><tr><th>Patient</th><td>${esc(x.name)} (${x.pid})</td></tr><tr><th>Allergies</th><td>${x.allergy?`<span class="tag e">${esc(x.allergy)}</span>`:'None recorded'}</td></tr></table>
 <table><tr><th>Drug</th><th>Qty</th><th>Dosage</th></tr>${x.items.map(i=>`<tr><td>${esc(i.d)}</td><td>${i.q}</td><td>${esc(i.s)}</td></tr>`).join('')}</table></div>`;
function rx(){const r=call('rx.view');return`<h1>Pharmacy</h1><p class="mu">Medical forms arrive here from the nurse. Confirm the patient's ID, give out the drugs, and the record is saved when you press Dispense.</p>
 ${r.P.map(x=>`<div>${doc(x)}<div class="np" style="display:flex;gap:10px;flex-wrap:wrap;margin:-6px 0 18px"><input style="flex:1;min-width:200px" id="c${x.id}" placeholder="Patient gives their unique ID"><button class="bt ok" onclick="run('rx.dispense',{rid:'${x.id}',id:$('#c${x.id}').value.trim()},'Dispensed and recorded.')">Confirm and dispense</button><button class="bt s" onclick="print()">Print form</button></div></div>`).join('')||'<div class="cd">No medical forms waiting.</div>'}
 <div class="cd"><h2>Dispensing record</h2>${r.D.length?`<table><tr><th>Form</th><th>Patient</th><th>Drugs</th><th>Given by</th><th>Date</th></tr>${r.D.map(x=>`<tr><td>${esc(x.no||x.id)}</td><td>${esc(x.name)}</td><td>${x.items.map(i=>esc(i.d)+' x'+i.q).join(', ')}</td><td>${esc(x.dby||'Pharmacist')}</td><td>${x.dd||x.date}</td></tr>`).join('')}</table>`:'<p class="mu">Nothing dispensed yet.</p>'}</div>`}
function stock(){return`<h1>Drug stock</h1><div class="cd"><div class="w"><table><tr><th>Drug</th><th>In stock</th><th>Status</th>${can('stock.edit')?'<th></th>':''}</tr>${call('stock.view').d.map((d,i)=>`<tr><td>${esc(d.n)}</td><td>${d.q}</td><td><span class="tag ${d.q<50?'w2':''}">${d.q<50?'Reorder':'OK'}</span></td>${can('stock.edit')?`<td><button class="bt s" onclick="add(${i})">Add stock</button></td>`:''}</tr>`).join('')}</table></div></div>`}
function add(i){const n=parseInt(prompt('Quantity received:'),10);if(n>0)run('stock.edit',{i,n},'Stock updated.')}
function recDash(){const p=call('pat.list').d;return`<h1>Records office</h1><div class="g">${card(p.length,'Registered patients')}${card(p.filter(x=>!x.paid).length,'Fees unpaid')}</div><p><button class="bt" onclick="go('pat')">Search or register patients</button> <button class="bt s" onclick="go('rpt')">Generate reports</button></p>`}
function usr(){const r=call('usr.list'),me=ses().email,ro=Object.keys(RL).filter(k=>k!=='STUDENT'),opts=sel=>ro.map(k=>`<option value="${k}" ${sel===k?'selected':''}>${RL[k]}</option>`).join('');
 return`<h1>User accounts</h1><p class="mu">Create staff accounts, assign roles and reset passwords. A new or reset account gets a one-time password that the user must change at first sign-in.</p>
 ${nu?`<div class="al"><b>${esc(nu.t)}</b> Email <b>${esc(nu.email)}</b>, one-time password <b>${esc(nu.pw)}</b>. Give it to the user privately.</div>`:''}
 <div class="cd"><h2>Add staff account</h2><div class="f"><label>Full name<input id="un"></label><label>Email<input id="ue" type="email" placeholder="name@health.mubs.ac.ug"></label><label>Role<select id="ur">${opts('')}</select></label></div><button class="bt" onclick="addU()">Create account</button></div>
 <div class="cd"><h2>Staff accounts</h2><div class="w"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>${r.U.map(u=>{const self=u.email===me;return`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td>${self?RL[u.role]:`<select aria-label="Role" onchange="run('usr.role',{email:'${u.email}',role:this.value},'Role updated.')">${opts(u.role)}</select>`}</td><td><span class="tag ${u.active?'':'e'}">${u.active?'Active':'Disabled'}</span>${u.temp?' <span class="tag w2">One-time password</span>':''}</td><td>${self?'<span class="mu">You</span>':`<button class="bt s" onclick="resetU({email:'${u.email}'})">Reset password</button> <button class="bt s" onclick="run('usr.toggle',{email:'${u.email}'},'Account updated.')">${u.active?'Disable':'Enable'}</button>`}</td></tr>`}).join('')}</table></div></div>
 <div class="cd"><h2>Patient accounts (students and workers)</h2><div class="w"><table><tr><th>Patient ID</th><th>Name</th><th>Type</th><th>Email</th><th></th></tr>${r.P.map(p=>`<tr><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.cat)}</td><td>${esc(p.email)}</td><td>${p.temp?'<span class="tag w2">One-time password</span> ':''}<button class="bt s" onclick="resetU({id:'${p.id}'})">Reset password</button></td></tr>`).join('')}</table></div></div>`}
function addU(){const g=i=>$(i).value.trim(),r=call('usr.create',{name:g('#un'),email:g('#ue').toLowerCase(),role:$('#ur').value});if(!r.ok)return toast(r.msg);nu={t:'Account created.',email:r.email,pw:r.pw};render()}
function resetU(a){const r=call('usr.reset',a);if(!r.ok)return toast(r.msg);nu={t:'Password reset.',email:r.email,pw:r.pw};render();scrollTo(0,0)}
const tbl=(a,h1,h2)=>a.length?`<table><tr><th>${h1}</th><th>${h2}</th></tr>${a.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('')}</table>`:'<p class="mu">No data yet.</p>';
function rpt(){const r=call('rpt.view');return`<h1>Reports</h1><p class="mu">MUBS Health Centre · generated ${esc(r.gen)}</p><div class="g">${card(r.n.p,'Registered patients')}${card(r.n.v,'Consultations')}${card(r.n.dd,'Prescriptions dispensed')}${card(r.n.e,'Emergency alerts')}${card(r.n.u,'Fees unpaid')}</div>
 <div class="cd"><h2>Consultations, last 7 days</h2>${tbl(r.days,'Date','Consultations')}</div><div class="cd"><h2>Common diagnoses</h2>${tbl(r.dx,'Diagnosis','Cases')}</div>
 <div class="cd"><h2>Drugs dispensed</h2>${tbl(r.dr,'Drug','Quantity')}</div><div class="cd"><h2>Emergency alerts by status</h2>${tbl(r.es,'Status','Alerts')}</div>
 <p class="np"><button class="bt" onclick="print()">Print report</button></p>`}
render();
</script></body></html>
